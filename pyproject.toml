[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alexandria-media"
version = "1.0.0"
description = "High-Performance Anime, TV & Movie Streaming Media Studio"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Alexandria Project Contributors" }
]
keywords = [
    "anime",
    "television",
    "movies",
    "streaming",
    "downloader",
    "hls",
    "jellyfin",
    "video-player",
    "terminal-ui",
    "cli"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Utilities"
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "scrapling[fetchers]>=0.5.0",
    "tqdm>=4.65.0",
    "imageio-ffmpeg>=0.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
    "build>=1.0.0",
    "wheel>=0.40.0"
]

[project.scripts]
alexandria = "run:main"

[project.urls]
Homepage = "https://github.com/alexandria-media/alexandria"
Repository = "https://github.com/alexandria-media/alexandria.git"
Issues = "https://github.com/alexandria-media/alexandria/issues"

[tool.setuptools.package-data]
"providers" = ["tokyoinsider_catalog.json"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
