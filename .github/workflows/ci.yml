name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[dev]"

    - name: Syntax and lint check
      run: |
        python -m py_compile run.py cli.py progress.py scraper.py
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=media,Book_Files,.venv,__pycache__

    - name: CLI interface verification
      run: |
        python run.py --help
        python -c "import cli, progress, scraper, run, providers, kitsu; print('Imports verified')"

    - name: Run test suite
      run: |
        pytest

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build wheel

    - name: Build sdist and wheel
      run: |
        python -m build

    - name: Verify wheel contents
      run: |
        python -m pip install dist/*.whl
        alexandria --help
